<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakFit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0A;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .logo { font-size: 52px; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 15px; color: #A1A1A1; margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #F97316;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .hint { font-size: 13px; color: #555; margin-top: 20px; }
    .error-icon { font-size: 48px; margin-bottom: 16px; }
    .error-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #EF4444; }
    .error-sub { font-size: 15px; color: #A1A1A1; }
  </style>
</head>
<body>

  <div class="card" id="view-open">
    <div class="logo">🔥</div>
    <div class="title">View on StreakFit</div>
    <div class="subtitle">Someone shared a post with you.</div>
    <button class="btn" onclick="openApp()">Open in StreakFit</button>
    <p class="hint">Don't have the app? Download StreakFit to view this post.</p>
  </div>

  <div class="card" id="view-invalid" style="display:none">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Invalid link</div>
    <div class="error-sub">This link is not valid or has expired.</div>
  </div>

  <script>
    var postId = null;

    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('id');
      var parsed = parseInt(raw, 10);

      if (!raw || isNaN(parsed) || parsed <= 0 || String(parsed) !== raw.trim()) {
        document.getElementById('view-open').style.display = 'none';
        document.getElementById('view-invalid').style.display = 'block';
      } else {
        postId = parsed;
      }
    })();

    function openApp() {
      if (!postId) return;

      var isAndroid = /android/i.test(navigator.userAgent);

      if (isAndroid) {
        // intent:// lets Chrome open the app or go to Play Store if not installed
        window.location.href =
          'intent://post/' + postId +
          '#Intent;scheme=streakfit;end';
      } else {
        // iOS Safari allows custom scheme on user gesture
        window.location.href = 'streakfit://post/' + postId;
      }
    }
  </script>

</body>
</html>
