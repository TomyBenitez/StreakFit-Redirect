<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakFit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0A;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { text-align: center; max-width: 360px; width: 100%; }
    .logo { font-size: 52px; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 15px; color: #A1A1A1; margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: block;
      background: #F97316;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 12px;
      text-decoration: none;
      width: 100%;
      text-align: center;
    }
    .hint { font-size: 13px; color: #555; margin-top: 20px; }
    .error-icon { font-size: 48px; margin-bottom: 16px; }
    .error-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #EF4444; }
    .error-sub { font-size: 15px; color: #A1A1A1; }
  </style>
</head>
<body>

  <div class="card" id="view-open">
    <div class="logo">🔥</div>
    <div class="title">View on StreakFit</div>
    <div class="subtitle">Someone shared a post with you.</div>
    <a id="open-btn" class="btn" href="#">Open in StreakFit</a>
    <p class="hint">Don't have the app? Download StreakFit to view this post.</p>
  </div>

  <div class="card" id="view-invalid" style="display:none">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Invalid link</div>
    <div class="error-sub">This link is not valid or has expired.</div>
  </div>

  <script>
    (function () {
      var params  = new URLSearchParams(window.location.search);
      var raw     = params.get('id');
      var parsed  = parseInt(raw, 10);

      if (!raw || isNaN(parsed) || parsed <= 0 || String(parsed) !== raw.trim()) {
        document.getElementById('view-open').style.display   = 'none';
        document.getElementById('view-invalid').style.display = 'block';
        return;
      }

      var btn      = document.getElementById('open-btn');
      var isAndroid = /android/i.test(navigator.userAgent);

      if (isAndroid) {
        // intent:// is the only reliable way on Chrome Android.
        // Chrome ignores non-http(s) fallback URLs (e.g. about:blank) and falls back to
        // its own Play Store lookup for the given package instead. Using the current
        // https page as the fallback keeps the user on this page when the app isn't installed.
        var fallback = encodeURIComponent(window.location.href);
        btn.href =
          'intent://post/' + parsed +
          '#Intent;scheme=streakfit;package=com.anonymous.StreakFit' +
          ';S.browser_fallback_url=' + fallback + ';end';
      } else {
        // iOS Safari allows custom scheme on user tap via anchor tag
        btn.href = 'streakfit://post/' + parsed;
      }
    })();
  </script>

</body>
</html>
